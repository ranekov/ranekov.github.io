<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>All posts — Ranekov</title>
<meta name="description"
content="{{ page.description | default: site.description | escape }}">
<link rel="canonical"
href="{{ page.url | absolute_url }}">
<link rel="stylesheet" href="{{ '/assets/css/common.css' | relative_url }}">
<link rel="stylesheet" href="{{ '/assets/css/blog.css' | relative_url }}">
</head>
<body>
<noscript>
  <div class="noscript-overlay">
    <div class="noscript-card">
      <p class="noscript-label">// JavaScript Required</p>
      <h1 class="noscript-title">JavaScript is disabled</h1>
      <div class="noscript-messages">
        <p>このサイトを利用するにはJavaScriptをオンにしてください。</p>
        <p>Please enable JavaScript in your browser settings to view this website.</p>
        <p>Пожалуйста, включите JavaScript в настройках браузера для просмотра этого сайта.</p>
      </div>
    </div>
  </div>
</noscript>

<nav>
  <a class="nav-logo" href="/">Ranekov</a>
  <div class="nav-links">
    <a class="link-btn" href="/link" id="link-nav-btn">Links</a>
    <div class="lang-group">
      <button class="lang-btn" onclick="setLang('ru')">RU</button>
      <button class="lang-btn" onclick="setLang('ja')">JA</button>
      <button class="lang-btn active" onclick="setLang('en')">EN</button>
    </div>
  </div>
  <div class="scroll-progress" id="scroll-progress"></div>
</nav>

<main>
  <p class="page-label" id="page-label">// Blog</p>
  <h1 class="page-title" id="page-title">All posts</h1>
  <div class="search-box">
    <input type="text" class="search-input" id="search-input" placeholder="Search...">
  </div>
  <div class="blog-results" id="blog-results">
    <div class="blog-list" id="blog-list">
      <div class="blog-empty" id="blog-loading">Loading...</div>
    </div>
    <div class="blog-loading-more" id="blog-loading-more" style="display:none;"></div>
  </div>
</main>

<footer>
  <span id="footer-year">© 2026 Ranekov</span> — built with <span id="footer-commit">...</span>
</footer>

<script src="{{ '/assets/js/blog.js' | relative_url }}"></script>

</body>
</html>
